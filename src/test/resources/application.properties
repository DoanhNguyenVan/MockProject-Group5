# Test bootstrap configuration: imports base app config + optional local credentials,
# then applies application-test-override.properties LAST so tests NEVER hit box_cinema or LIVE PayOS.
spring.config.import=optional:file:./src/main/resources/application.properties,optional:file:.env[.properties],optional:file:./config/application-local.properties,optional:file:./src/main/resources/application-local.properties,optional:classpath:application-local.properties,classpath:application-test-override.properties
