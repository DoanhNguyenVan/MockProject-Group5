spring.application.name=box-cinema
server.port=8080

# Import local credentials if available (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Database Datasource (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/box_cinema?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Database Seeding (false = only real DB data)
app.database.seed-enabled=${SEED_DATA:false}

# OAuth2 Social Login & Separate Flow Callbacks (Google OIDC + PKCE S256)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.oauth2.google.link-redirect-uri=${GOOGLE_LINK_REDIRECT_URI:}
app.oauth2.google.set-password-redirect-uri=${GOOGLE_SET_PASSWORD_REDIRECT_URI:}
app.oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth2.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/facebook}

# Gmail SMTP Configuration for JavaMailSender (OTP, Inquiry Confirmation, Account Alerts)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.3 TLSv1.2
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.tcp.nodelay=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=BOX Cinema

# OTP Configuration (Externalized per V1.2 Section C3)
app.otp.length=${OTP_LENGTH:6}
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
app.otp.max-resends-per-challenge=${OTP_MAX_RESENDS_PER_CHALLENGE:3}
app.otp.max-sends-per-email-per-hour=${OTP_MAX_SENDS_PER_EMAIL_PER_HOUR:10}
app.otp.max-sends-per-ip-per-hour=${OTP_MAX_SENDS_PER_IP_PER_HOUR:30}
app.otp.lock-duration-minutes=${OTP_LOCK_DURATION_MINUTES:15}
app.otp.reset-token-expiration-minutes=${OTP_RESET_TOKEN_EXPIRATION_MINUTES:10}

# Security, Argon2id & Rate Limiting (Externalized per V1.2 Sections D1, K, L)
app.security.hmac-secret=${HMAC_SECRET:BOX_CINEMA_DEFAULT_SECURE_HMAC_SECRET_KEY_2026_@!#}
app.security.argon2.memory-kib=${ARGON2_MEMORY_KIB:19456}
app.security.argon2.iterations=${ARGON2_ITERATIONS:2}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.login.progressive-delay-enabled=${LOGIN_PROGRESSIVE_DELAY_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Session Cookie Hardening (HttpOnly, SameSite=Lax for OAuth2 redirect, Secure on HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BOX_SESSION_COOKIE_SECURE:false}