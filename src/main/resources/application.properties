spring.application.name=box-cinema
server.port=${PORT:8080}
# Movie Ticket QR Verification Base URL (Render HTTPS in production; override via TICKET_PUBLIC_BASE_URL or application-local.properties)
app.ticket.public-base-url=${TICKET_PUBLIC_BASE_URL:${PUBLIC_BASE_URL:${APP_PUBLIC_BASE_URL:https://box-cinema.onrender.com}}}
app.public-base-url=${PUBLIC_BASE_URL:${APP_PUBLIC_BASE_URL:https://box-cinema.onrender.com}}
app.qr.storage-dir=${QR_STORAGE_DIR:./uploads/booking-qr}

# Import local credentials if available (git-ignored)
spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Database Datasource (MySQL / TiDB Cloud Serverless)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/box_cinema?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# HikariCP Connection Pool Optimization (Tuned for Render 512MB RAM & TiDB Cloud)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Database Seeding (false = only real DB data)
app.database.seed-enabled=${SEED_DATA:false}

# OAuth2 Social Login & Separate Flow Callbacks (Google OIDC + PKCE S256)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.oauth2.google.link-redirect-uri=${GOOGLE_LINK_REDIRECT_URI:}
app.oauth2.google.set-password-redirect-uri=${GOOGLE_SET_PASSWORD_REDIRECT_URI:}
app.oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth2.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/facebook}

# Gmail SMTP Configuration for JavaMailSender (OTP, Inquiry Confirmation, Account Alerts)
# Port 465 with SSL is required for cloud providers like Render where port 587 is firewalled
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.3 TLSv1.2
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.tcp.nodelay=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.from=${spring.mail.username:support@boxcinema.vn}
# Mailjet Send API v3.1 Configuration (Port 443 HTTP - Bypasses Cloud SMTP Port Blocking)
mailjet.api.key=${MAILJET_API_KEY:}
mailjet.secret.key=${MAILJET_SECRET_KEY:}
mailjet.sender.email=${MAILJET_SENDER_EMAIL:}
mailjet.sender.name=BOX Cinema

# Resend HTTP API Configuration (Port 443 - Bypasses Cloud SMTP Port Blocking)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:BOX Cinema <onboarding@resend.dev>}
app.mail.from-name=BOX Cinema

# OTP Configuration (Externalized per V1.2 Section C3)
app.otp.length=${OTP_LENGTH:6}
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
app.otp.max-resends-per-challenge=${OTP_MAX_RESENDS_PER_CHALLENGE:3}
app.otp.max-sends-per-email-per-hour=${OTP_MAX_SENDS_PER_EMAIL_PER_HOUR:10}
app.otp.max-sends-per-ip-per-hour=${OTP_MAX_SENDS_PER_IP_PER_HOUR:30}
app.otp.lock-duration-minutes=${OTP_LOCK_DURATION_MINUTES:15}
app.otp.reset-token-expiration-minutes=${OTP_RESET_TOKEN_EXPIRATION_MINUTES:10}

# Security, Argon2id & Rate Limiting (Externalized per V1.2 Sections D1, K, L)
app.security.hmac-secret=${HMAC_SECRET:BOX_CINEMA_DEFAULT_SECURE_HMAC_SECRET_KEY_2026_@!#}
app.security.argon2.memory-kib=${ARGON2_MEMORY_KIB:19456}
app.security.argon2.iterations=${ARGON2_ITERATIONS:2}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.login.progressive-delay-enabled=${LOGIN_PROGRESSIVE_DELAY_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Session Cookie Hardening (HttpOnly, SameSite=Lax for OAuth2 redirect, Secure on HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BOX_SESSION_COOKIE_SECURE:false}

# PayOS Payment Gateway Configuration (Collection / Thu ho)
payos.client-id=${PAYOS_CLIENT_ID:dummy-client-id}
payos.api-key=${PAYOS_API_KEY:dummy-api-key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:BOX_CINEMA_DEFAULT_SECURE_PAYOS_KEY_2026_@!#}
payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/booking/buy-tickets}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/booking/buy-tickets}
payos.collection.mode=${PAYOS_COLLECTION_MODE:MOCK}
payos.collection.base-url=${PAYOS_COLLECTION_BASE_URL:${payos.base-url:https://api-merchant.payos.vn}}
payos.collection.client-id=${PAYOS_COLLECTION_CLIENT_ID:${payos.client-id:dummy-client-id}}
payos.collection.api-key=${PAYOS_COLLECTION_API_KEY:${payos.api-key:dummy-api-key}}
payos.collection.checksum-key=${PAYOS_COLLECTION_CHECKSUM_KEY:${payos.checksum-key:BOX_CINEMA_DEFAULT_SECURE_PAYOS_KEY_2026_@!#}}
payos.collection.return-url=${PAYOS_COLLECTION_RETURN_URL:${payos.return-url:http://localhost:8080/booking/buy-tickets}}
payos.collection.cancel-url=${PAYOS_COLLECTION_CANCEL_URL:${payos.cancel-url:http://localhost:8080/booking/buy-tickets}}
payos.collection.allow-simulate=${PAYOS_COLLECTION_ALLOW_SIMULATE:false}

# PayOS Payout Gateway (Chi ho) - STRICTLY SEPARATE from PayOS Payment (payos.*)
payos.payout.mode=${PAYOS_PAYOUT_MODE:MOCK}
payos.payout.base-url=${PAYOS_PAYOUT_BASE_URL:https://api-merchant.payos.vn}
payos.payout.client-id=${PAYOS_PAYOUT_CLIENT_ID:}
payos.payout.api-key=${PAYOS_PAYOUT_API_KEY:}
payos.payout.checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:}
payos.payout.connect-timeout-ms=${PAYOS_PAYOUT_CONNECT_TIMEOUT_MS:10000}
payos.payout.read-timeout-ms=${PAYOS_PAYOUT_READ_TIMEOUT_MS:30000}
payos.payout.reconcile-poll-interval-ms=${PAYOS_PAYOUT_RECONCILE_POLL_INTERVAL_MS:30000}
payos.payout.not-found-grace-seconds=${PAYOS_PAYOUT_NOT_FOUND_GRACE_SECONDS:120}

# Refund Policy & Bank Data Encryption
app.refund.voucher.expiry-days=${REFUND_VOUCHER_EXPIRY_DAYS:30}
app.refund.evidence-dir=${REFUND_EVIDENCE_DIR:uploads/refund-evidence}
app.security.bank-encryption-key=${BANK_DATA_ENC_KEY:}


# Chatbot & AI Agent Configuration (Direct Gemini API & n8n Fallback)
app.chatbot.enabled=${CHATBOT_ENABLED:true}
app.chatbot.gemini.api-key=${GEMINI_API_KEY:}
app.chatbot.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.chatbot.n8n.webhook-url=${N8N_CHATBOT_WEBHOOK_URL:http://localhost:5678/webhook/box-cinema-chat}
app.chatbot.n8n.timeout-seconds=${N8N_CHATBOT_TIMEOUT_SECONDS:25}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Profile Avatar & Movie Media Storage & Multipart Limits
app.avatar.storage-dir=${AVATAR_STORAGE_DIR:./uploads/avatars}
app.avatar.cloudinary-folder=${CLOUDINARY_AVATAR_FOLDER:box-cinema/avatars}
app.movie-media.storage-dir=${MOVIE_MEDIA_STORAGE_DIR:./uploads/movies}
app.movie-media.cloudinary-folder=${CLOUDINARY_MOVIE_FOLDER:box-cinema/movies}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

