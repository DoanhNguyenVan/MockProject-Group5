<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="BOX Cinema Logo">
  <defs>
    <linearGradient id="boxRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C91934" />
      <stop offset="55%" stop-color="#C91934" />
      <stop offset="100%" stop-color="#C91934" />
    </linearGradient>
    <linearGradient id="boxFlapLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C91934" />
      <stop offset="100%" stop-color="#C91934" />
    </linearGradient>
    <linearGradient id="boxDarkSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2230" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="projectorBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#C91934" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#C91934" stop-opacity="0.08" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#C91934" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Isometric Open Projector Box Icon -->
  <g transform="translate(8, 10)">
    <!-- Left dark vertical face -->
    <polygon points="18,56 42,72 42,114 18,96" fill="url(#boxDarkSide)" stroke="#2a3142" stroke-width="1" />
    <!-- Vertical red accent strip at corner -->
    <polygon points="38,69 44,73 44,115 38,111" fill="url(#boxRedGrad)" />
    <!-- Front-right dark face with open projector mouth -->
    <polygon points="44,73 116,42 44,68" fill="#121722" />
    <polygon points="44,68 118,88 118,100 44,115" fill="url(#boxDarkSide)" stroke="#262c3a" stroke-width="0.8" />
    <!-- Projector light beam inside the open box -->
    <polygon points="43,68 116,42 118,88" fill="url(#projectorBeam)" />
    <!-- Left open flap (orange-red) -->
    <polygon points="4,48 28,38 50,49 42,71 18,56" fill="url(#boxFlapLeft)" filter="url(#redGlow)" />
    <!-- Main top right open flap (glowing crimson-orange) -->
    <polygon points="43,66 68,24 128,12 116,40" fill="url(#boxRedGrad)" filter="url(#redGlow)" />
  </g>

  <!-- Typography: "box cinema" -->
  <g transform="translate(150, 0)">
    <!-- "box" in bold geometric white -->
    <text x="0" y="98" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#ffffff">box</text>
    <!-- "cinema" in sleek bold crimson-red with subtle glow -->
    <text x="118" y="98" font-family="'Times New Roman', Times, serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#C91934" filter="url(#redGlow)">cinema</text>
  </g>
</svg>
