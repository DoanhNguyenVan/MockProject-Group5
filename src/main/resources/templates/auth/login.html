<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : 'demo-csrf-token'}" content="demo-csrf-token">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}" content="X-CSRF-TOKEN">
  <title>Member Login | BOX Cinema</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
  <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}">
</head>
<body>
  <!-- Shared Brand Logo & Navigation Navbar -->
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <main id="main-content" tabindex="-1">
    <section class="auth-page-section" aria-label="Member Sign In">
      <div class="auth-split-shell">
        <aside class="auth-welcome" aria-label="Welcome to BOX Cinema">
          <div class="auth-theater" aria-hidden="true"></div>
          <div class="auth-brand">
            <img src="/assets/img/box-cinema-logo.png" th:src="@{/assets/img/box-cinema-logo.png}" width="180" height="60" alt="BOX Cinema">
            <p>Welcome to BOX Cinema!</p>
          </div>
        </aside>
        <div class="auth-form-col">
          <!-- Mode Switcher Tabs (/login <-> /register) -->
          <div class="auth-mode-tabs" role="navigation" aria-label="Authentication Mode Switcher">
            <a
              href="/login"
              th:href="@{/login}"
              class="auth-mode-tab active"
              aria-current="page"
            >Sign In</a>
            <a
              href="/register"
              th:href="@{/register}"
              class="auth-mode-tab"
            >Create Account</a>
          </div>

          <h1 class="h3 fw-bold text-white mb-1">Log in to BOX Cinema</h1>
          <p class="small text-secondary mb-3">Use your email and password to try the sign-in form.</p>

          <div class="auth-providers" role="group" aria-label="Social sign-in">
            <button type="button" class="provider-option" disabled>
              <span class="provider-initial" aria-hidden="true">G</span> Continue with Google
            </button>
            <button type="button" class="provider-option" disabled>
              <span class="provider-initial provider-facebook" aria-hidden="true">f</span> Continue with Facebook
            </button>
          </div>
          <p class="provider-note">Social sign-in is unavailable in this demo.</p>

          <div class="auth-divider"><span>OR SIGN IN WITH EMAIL</span></div>

          <div id="loginFormStatus" class="d-none" role="alert" aria-live="polite"></div>

          <form id="loginForm" action="/login" th:action="@{/login}" method="post" novalidate>
            <input
              type="hidden"
              name="_csrf"
              th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
              th:value="${_csrf != null ? _csrf.token : 'demo-csrf-token'}"
              value="demo-csrf-token"
            >

            <div class="mb-3">
              <label for="loginEmail" class="form-label small text-secondary fw-semibold">Email Address *</label>
              <input
                type="email"
                id="loginEmail"
                name="username"
                class="form-control form-control-dark"
                placeholder="alex@boxcinema.com"
                autocomplete="email"
                required
              >
              <div id="loginEmailError" class="field-error-msg"></div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="loginPassword" class="form-label small text-secondary fw-semibold">Password *</label>
                <a href="/contact" th:href="@{/contact}" class="small text-glow-red">Forgot password?</a>
              </div>
              <div class="auth-input-group">
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  class="form-control form-control-dark pe-5"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                >
                <button
                  type="button"
                  class="btn-password-toggle"
                  data-toggle-password="loginPassword"
                  aria-label="Toggle password visibility"
                >Show</button>
              </div>
              <div id="loginPasswordError" class="field-error-msg"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                <label class="form-check-label small text-secondary" for="rememberMe">
                  Keep me signed in
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-box-primary w-100 py-2 mb-3">Sign In to Account</button>

            <p class="text-center small text-secondary mb-0">
              New to BOX Cinema?
              <a href="/register" th:href="@{/register}" class="text-glow-red fw-bold ms-1">Create a Free Account &#8594;</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <script type="module" src="/js/modules/navbar.js" th:src="@{/js/modules/navbar.js}"></script>
  <script type="module" src="/js/modules/auth-validation.js" th:src="@{/js/modules/auth-validation.js}"></script>
</body>
</html>
