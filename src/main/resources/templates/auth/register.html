<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : 'demo-csrf-token'}" content="demo-csrf-token">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}" content="X-CSRF-TOKEN">
  <title>Create Account (Sign Up) | BOX Cinema</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
  <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}">
</head>
<body>
  <!-- Shared Brand Logo & Navigation Navbar -->
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <main id="main-content" tabindex="-1">
    <section class="auth-page-section" aria-label="Create Member Account">
      <div class="auth-split-shell">
        <aside class="auth-welcome" aria-label="Welcome to BOX Cinema">
          <div class="auth-theater" aria-hidden="true"></div>
          <div class="auth-brand">
            <img src="/assets/img/box-cinema-logo.svg" th:src="@{/assets/img/box-cinema-logo.svg}" width="180" height="48" alt="BOX Cinema">
            <p>Welcome to BOX Cinema!</p>
          </div>
        </aside>
        <div class="auth-form-col">
          <!-- Mode Switcher Tabs (/login <-> /register) -->
          <div class="auth-mode-tabs" role="navigation" aria-label="Authentication Mode Switcher">
            <a
              href="/login"
              th:href="@{/login}"
              class="auth-mode-tab"
            >Sign In</a>
            <a
              href="/register"
              th:href="@{/register}"
              class="auth-mode-tab active"
              aria-current="page"
            >Create Account</a>
          </div>

          <h1 class="h3 fw-bold text-white mb-1">Create your account</h1>
          <p class="small text-secondary mb-3">Fill in your details to preview registration.</p>

          <div class="auth-providers" role="group" aria-label="Social sign-in">
            <button type="button" class="provider-option" disabled>
              <span class="provider-initial" aria-hidden="true">G</span> Continue with Google
            </button>
            <button type="button" class="provider-option" disabled>
              <span class="provider-initial provider-facebook" aria-hidden="true">f</span> Continue with Facebook
            </button>
          </div>
          <p class="provider-note">Social sign-in is unavailable in this demo.</p>

          <div class="auth-divider"><span>OR REGISTER WITH EMAIL</span></div>

          <div id="registerFormStatus" class="d-none" role="alert" aria-live="polite"></div>

          <form id="registerForm" action="/register" th:action="@{/register}" method="post" novalidate>
            <input
              type="hidden"
              name="_csrf"
              th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
              th:value="${_csrf != null ? _csrf.token : 'demo-csrf-token'}"
              value="demo-csrf-token"
            >

            <div class="row g-3">
              <div class="col-12">
                <label for="regFullName" class="form-label small text-secondary fw-semibold">Full Name *</label>
                <input
                  type="text"
                  id="regFullName"
                  name="fullName"
                  class="form-control form-control-dark"
                  placeholder="e.g., Alex Nguyen"
                  autocomplete="name"
                  required
                >
                <div id="regFullNameError" class="field-error-msg"></div>
              </div>

              <div class="col-md-6">
                <label for="regEmail" class="form-label small text-secondary fw-semibold">Email Address *</label>
                <input
                  type="email"
                  id="regEmail"
                  name="email"
                  class="form-control form-control-dark"
                  placeholder="alex@boxcinema.com"
                  autocomplete="email"
                  required
                >
                <div id="regEmailError" class="field-error-msg"></div>
              </div>

              <div class="col-md-6">
                <label for="regPhone" class="form-label small text-secondary fw-semibold">Mobile Phone *</label>
                <input
                  type="tel"
                  id="regPhone"
                  name="phone"
                  class="form-control form-control-dark"
                  placeholder="+84 901 234 567"
                  autocomplete="tel"
                  required
                >
                <div id="regPhoneError" class="field-error-msg"></div>
              </div>

              <div class="col-md-6">
                <label for="regPassword" class="form-label small text-secondary fw-semibold">Password (Min 8 chars) *</label>
                <div class="auth-input-group">
                  <input
                    type="password"
                    id="regPassword"
                    name="password"
                    class="form-control form-control-dark pe-5"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                  >
                  <button
                    type="button"
                    class="btn-password-toggle"
                    data-toggle-password="regPassword"
                    aria-label="Toggle password visibility"
                  >Show</button>
                </div>
                <div id="regPasswordError" class="field-error-msg"></div>
              </div>

              <div class="col-md-6">
                <label for="regConfirmPassword" class="form-label small text-secondary fw-semibold">Confirm Password *</label>
                <div class="auth-input-group">
                  <input
                    type="password"
                    id="regConfirmPassword"
                    name="confirmPassword"
                    class="form-control form-control-dark pe-5"
                    placeholder="Repeat password"
                    autocomplete="new-password"
                    required
                  >
                  <button
                    type="button"
                    class="btn-password-toggle"
                    data-toggle-password="regConfirmPassword"
                    aria-label="Toggle confirm password visibility"
                  >Show</button>
                </div>
                <div id="regConfirmPasswordError" class="field-error-msg"></div>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="regTerms" name="termsAccepted" required>
                  <label class="form-check-label small text-secondary" for="regTerms">
                    I agree to the BOX Cinema <a href="/about" th:href="@{/about}" class="text-glow-red">Terms of Service</a> and <a href="/about" th:href="@{/about}" class="text-glow-red">Privacy Policy</a>.
                  </label>
                </div>
                <div id="regTermsError" class="field-error-msg"></div>
              </div>

              <div class="col-12 pt-1">
                <button type="submit" class="btn btn-box-primary w-100 py-2 mb-2">Create My BOX Account</button>
              </div>
            </div>

            <p class="text-center small text-secondary mb-0 mt-2">
              Already have an account?
              <a href="/login" th:href="@{/login}" class="text-glow-red fw-bold ms-1">&#8592; Sign In Here</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <script type="module" src="/js/modules/navbar.js" th:src="@{/js/modules/navbar.js}"></script>
  <script type="module" src="/js/modules/auth-validation.js" th:src="@{/js/modules/auth-validation.js}"></script>
</body>
</html>
