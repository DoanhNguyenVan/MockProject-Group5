<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" content="">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}" content="X-CSRF-TOKEN">
  <title>Incident Reports | BOX Cinema Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=20261113c" th:href="@{/css/main.css(v='20261113c')}">
  <style>
    body { background-color: var(--box-bg-primary); color: var(--box-text-primary); }
    .staff-container { max-width: 1100px; margin: 36px auto; padding: 0 16px; }
    .staff-card { background: var(--box-bg-card); border: 1px solid var(--box-border-color); border-radius: var(--box-radius-md); padding: 24px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <header th:replace="~{fragments/navbar :: navbar}"></header>
  <main class="staff-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h2 class="h3 fw-bold text-white mb-1">Operational Incident Reporting</h2>
        <p class="text-secondary mb-0">Report Cinema Incidents, Product Incidents, or Staff Errors (verification required by Manager).</p>
      </div>
      <div class="d-flex gap-2">
        <a href="/staff/checkin" class="btn btn-box-outline">Ticket Check-in</a>
        <a href="/staff/food" class="btn btn-box-outline">Concessions / KDS</a>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="staff-card">
          <h4 class="h5 text-white mb-3">Submit New Incident Report</h4>
          <div id="incidentSubmitMsg" class="d-none"></div>
          <form id="staffIncidentForm">
            <div class="mb-2">
              <label class="form-label small text-secondary">Incident Group *</label>
              <select id="incGroup" class="form-select form-select-dark" required>
                <option value="CINEMA_INCIDENT">Cinema Incident (Projector, Sound, Power, Room)</option>
                <option value="PRODUCT_INCIDENT">Product Incident (Spoiled Food, Out of Stock, Defective)</option>
                <option value="STAFF_ERROR">Staff Error (Wrong Item, Missing Item, Counter Mistake)</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label small text-secondary">Incident Type *</label>
              <select id="incType" class="form-select form-select-dark" required>
                <option value="PROJECTOR_FAILURE">Projector Failure</option>
                <option value="SOUND_SYSTEM_FAILURE">Sound System Failure</option>
                <option value="POWER_OUTAGE">Power Outage</option>
                <option value="SHOWTIME_CANCELLED">Showtime Cancelled</option>
                <option value="DEFECTIVE_FOOD">Defective / Spoiled Food</option>
                <option value="OUT_OF_STOCK_AFTER_PAYMENT">Out of Stock After Payment</option>
                <option value="WRONG_FOOD_DELIVERED">Wrong Food Delivered</option>
                <option value="MISSING_FOOD_ITEM">Missing Food Item</option>
                <option value="COUNTER_HANDLING_ERROR">Counter Handling Error</option>
              </select>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small text-secondary">Severity</label>
                <select id="incSeverity" class="form-select form-select-dark">
                  <option value="LOW">LOW</option>
                  <option value="MEDIUM" selected>MEDIUM</option>
                  <option value="HIGH">HIGH</option>
                  <option value="CRITICAL">CRITICAL</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small text-secondary">Booking Code (optional)</label>
                <input type="text" id="incBookingCode" class="form-control form-control-dark" placeholder="BOX-20261121-1234">
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small text-secondary">Title *</label>
              <input type="text" id="incTitle" class="form-control form-control-dark" placeholder="Brief summary of incident" required>
            </div>
            <div class="mb-2">
              <label class="form-label small text-secondary">Description *</label>
              <textarea id="incDescription" rows="3" class="form-control form-control-dark" placeholder="Provide details, showtime, room, or affected items..." required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">Evidence Image / URL</label>
              <input type="file" id="incEvidenceFile" accept="image/png,image/jpeg,image/webp" class="form-control form-control-dark mb-1">
              <input type="text" id="incEvidenceUrl" class="form-control form-control-dark" placeholder="https://... or uploaded path">
            </div>
            <button type="submit" class="btn btn-box-primary w-100">Submit Incident Report</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="staff-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="h5 text-white mb-0">Branch Incident Reports</h4>
            <button class="btn btn-sm btn-outline-secondary" id="btnRefreshIncidents">Refresh</button>
          </div>
          <div id="staffIncidentList">Loading incidents...</div>
        </div>
      </div>
    </div>
  </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <script type="module" src="/js/modules/navbar.js?v=20261113a" th:src="@{/js/modules/navbar.js(v='20261113a')}"></script>
  <script>
    function csrfHeaders() {
      const t = document.querySelector('meta[name="_csrf"]')?.content;
      const h = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
      return t ? { [h]: t } : {};
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('bookingCode')) {
      document.getElementById('incBookingCode').value = urlParams.get('bookingCode');
    }

    document.getElementById('incEvidenceFile').addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const fd = new FormData();
      fd.append('file', f);
      const res = await fetch('/api/staff/incidents/evidence-upload', { method: 'POST', headers: csrfHeaders(), body: fd });
      const d = await res.json();
      if (res.ok && d.url) document.getElementById('incEvidenceUrl').value = d.url;
    });

    document.getElementById('staffIncidentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('incidentSubmitMsg');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      try {
        const payload = {
          incidentGroup: document.getElementById('incGroup').value,
          incidentType: document.getElementById('incType').value,
          severity: document.getElementById('incSeverity').value,
          bookingCode: document.getElementById('incBookingCode').value.trim() || null,
          title: document.getElementById('incTitle').value.trim(),
          description: document.getElementById('incDescription').value.trim(),
          evidenceUrl: document.getElementById('incEvidenceUrl').value.trim() || null
        };
        const res = await fetch('/api/staff/incidents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...csrfHeaders() },
          credentials: 'same-origin',
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        msg.className = `alert ${res.ok ? 'alert-success' : 'alert-danger'} mb-3`;
        msg.textContent = res.ok ? `Submitted ${data.incidentCode} (${data.status})` : (data.message || 'Submission failed');
        if (res.ok) {
          e.target.reset();
          loadIncidents();
        }
      } catch (_) {
        msg.className = 'alert alert-danger mb-3';
        msg.textContent = 'Network error while submitting incident report.';
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });

    async function loadIncidents() {
      const container = document.getElementById('staffIncidentList');
      const res = await fetch('/api/staff/incidents');
      if (!res.ok) { container.textContent = 'Unable to load incidents.'; return; }
      const page = await res.json();
      const rows = page.content || [];
      container.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'text-secondary py-3';
        empty.textContent = 'No incidents reported yet for your branch.';
        container.append(empty);
        return;
      }
      for (const ir of rows) {
        const card = document.createElement('div');
        card.className = 'p-3 mb-2 rounded border border-secondary border-opacity-25';
        const title = document.createElement('div');
        title.className = 'fw-bold text-white';
        title.textContent = `${ir.incidentCode} • ${ir.title} [${ir.status}]`;
        const meta = document.createElement('div');
        meta.className = 'small text-secondary mt-1';
        meta.textContent = `${ir.incidentGroup} / ${ir.incidentType} • Severity: ${ir.severity}${ir.bookingCode ? ' • Order: ' + ir.bookingCode : ''}`;
        const desc = document.createElement('div');
        desc.className = 'small text-light mt-1';
        desc.textContent = ir.description;
        card.append(title, meta, desc);

        if (ir.managerNote) {
          const mn = document.createElement('div');
          mn.className = 'small text-warning mt-1';
          mn.textContent = `Manager (${ir.managerDecision || ''}): ${ir.managerNote}`;
          card.append(mn);
        }
        if (ir.status === 'MORE_EVIDENCE_REQUIRED') {
          const form = document.createElement('div');
          form.className = 'mt-2 d-flex gap-2';
          const inp = document.createElement('input');
          inp.className = 'form-control form-control-sm form-control-dark';
          inp.placeholder = 'Add follow-up note/evidence...';
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm btn-warning';
          btn.textContent = 'Submit Evidence';
          btn.onclick = async () => {
            if (!inp.value.trim()) return;
            btn.disabled = true;
            try {
              const r = await fetch(`/api/staff/incidents/${ir.id}/evidence`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeaders() },
                credentials: 'same-origin',
                body: JSON.stringify({ note: inp.value.trim() })
              });
              if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                alert(err.message || 'Failed to submit evidence.');
                return;
              }
              loadIncidents();
            } finally {
              btn.disabled = false;
            }
          };
          form.append(inp, btn);
          card.append(form);
        } else if (ir.status === 'REJECTED') {
          const form = document.createElement('div');
          form.className = 'mt-2 d-flex gap-2';
          const inp = document.createElement('input');
          inp.className = 'form-control form-control-sm form-control-dark';
          inp.placeholder = 'Appeal reason to Admin...';
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm btn-outline-danger';
          btn.textContent = 'Appeal to Admin';
          btn.onclick = async () => {
            if (!inp.value.trim()) return;
            btn.disabled = true;
            try {
              const r = await fetch(`/api/staff/incidents/${ir.id}/appeal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...csrfHeaders() },
                credentials: 'same-origin',
                body: JSON.stringify({ appealReason: inp.value.trim() })
              });
              if (!r.ok) {
                const err = await r.json().catch(() => ({}));
                alert(err.message || 'Failed to submit appeal.');
                return;
              }
              loadIncidents();
            } finally {
              btn.disabled = false;
            }
          };
          form.append(inp, btn);
          card.append(form);
        }
        container.append(card);
      }
    }
    document.getElementById('btnRefreshIncidents').addEventListener('click', loadIncidents);
    document.addEventListener('DOMContentLoaded', loadIncidents);
  </script>
</body>
</html>
