<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('Movie Management')}"></head>
<body class="admin-page">
  <div class="admin-shell">
    <!-- Sidebar Navigation -->
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('movies')}"></aside>

    <!-- Main Content Area -->
    <section class="admin-content">
      <!-- Standardized Docked Topbar -->
      <header th:replace="~{admin/fragments/admin-shell :: topbar('Movies', null, '/admin/movies')}"></header>

      <div class="admin-content-body">
        <!-- Page Heading -->
        <div class="admin-page-heading mb-4">
          <div>
            <p class="admin-eyebrow">ADMINISTRATION</p>
            <h1>Movies</h1>
            <p>Curate and manage movies in BOX Cinema</p>
          </div>
          <div>
            <a th:href="@{/admin/movies/create}" class="admin-button admin-button-primary">
              + Add Movie
            </a>
          </div>
        </div>

        <!-- Messages -->
        <div th:if="${successMessage}" class="alert alert-success mb-3" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mb-3" th:text="${errorMessage}"></div>

        <!-- Movie Table Panel -->
        <div class="admin-table-panel">
          <div class="d-flex justify-content-between align-items-center px-4 py-3" style="border-bottom: 1px solid var(--box-border-color); background: var(--box-bg-elevated);">
            <h2 style="font-size: 15px; font-weight: 700; margin: 0; color: var(--box-text-primary);">All Movies</h2>
            <span style="font-size: 12px; color: var(--box-text-muted);" th:text="'Total: ' + ${#lists.size(movies)}">Total: 0</span>
          </div>

          <div class="admin-table-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="min-width: 60px;">ID</th>
                  <th style="min-width: 80px;">Poster</th>
                  <th>Title</th>
                  <th>Genres</th>
                  <th>Duration</th>
                  <th>Age Rating</th>
                  <th>Release Date</th>
                  <th>Status</th>
                  <th style="min-width: 150px;">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="movie : ${movies}">
                  <td th:text="${movie.movieId}"></td>
                  <td>
                    <img th:if="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl)}"
                         th:src="${movie.posterUrl}"
                         style="width: 50px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--box-border-color);"
                         alt="Poster">
                    <div th:unless="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl)}"
                         style="width: 50px; height: 72px; border-radius: 6px; background: var(--box-bg-elevated); border: 1px solid var(--box-border-color); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--box-text-muted);">
                      No img
                    </div>
                  </td>
                  <td>
                    <div style="font-weight: 700; color: var(--box-text-primary);" th:text="${movie.title}"></div>
                  </td>
                  <td>
                    <span style="color: var(--box-text-secondary); font-size: 13px;"
                          th:text="${movie.genreNamesDisplay != null and !#strings.isEmpty(movie.genreNamesDisplay) ? movie.genreNamesDisplay : 'No genre'}"></span>
                  </td>
                  <td th:text="${movie.durationMinutes} + ' min'"></td>
                  <td>
                    <span class="badge bg-secondary" style="font-weight: 600;" th:text="${movie.ageRating}"></span>
                  </td>
                  <td th:text="${movie.releaseDate}"></td>
                  <td>
                    <span class="admin-status-pill"
                          th:classappend="${movie.status == 'NOW_SHOWING' ? 'admin-status-now_showing' : (movie.status == 'COMING_SOON' ? 'admin-status-coming_soon' : 'admin-status-ended')}">
                      <span class="admin-status-dot"></span>
                      <span th:text="${movie.status}"></span>
                    </span>
                  </td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <a th:href="@{/admin/movies/edit/{id}(id=${movie.movieId})}"
                         class="admin-btn-action admin-btn-action-edit">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span>Sửa</span>
                      </a>
                      <form th:action="@{/admin/movies/delete/{id}(id=${movie.movieId})}"
                            method="post" class="m-0 p-0 d-inline"
                            onsubmit="return confirm('Are you sure you want to delete this movie?')">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="admin-btn-action admin-btn-action-delete">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                          <span>Xóa</span>
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movies)}">
                  <td colspan="9" class="text-center py-5" style="color: var(--box-text-muted);">
                    No movies found. Add your first movie!
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
