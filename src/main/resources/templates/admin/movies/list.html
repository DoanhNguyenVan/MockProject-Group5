<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head('Movie Management')}"></head>
<body class="admin-page">
  <div class="admin-shell">
    <!-- Sidebar Navigation -->
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('movies')}"></aside>

    <!-- Main Content Area -->
    <section class="admin-content">
      <!-- Standardized Docked Topbar -->
      <header th:replace="~{admin/fragments/admin-shell :: topbar('Movies', null, '/admin/movies')}"></header>

      <div class="admin-content-body">
        <!-- Page Heading -->
        <div class="admin-page-heading mb-4">
          <div>
            <p class="admin-eyebrow">ADMINISTRATION</p>
            <h1>Movies</h1>
            <p>Curate and manage movies in BOX Cinema</p>
          </div>
          <div>
            <button type="button" class="admin-button admin-button-primary" onclick="openAddMovieModal()">
              + Add movie
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div th:if="${successMessage}" class="alert alert-success mb-3" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mb-3" th:text="${errorMessage}"></div>

        <!-- Movie Table Panel -->
        <div class="admin-table-panel">
          <div class="d-flex justify-content-between align-items-center px-4 py-3" style="border-bottom: 1px solid var(--box-border-color); background: var(--box-bg-elevated);">
            <h2 style="font-size: 15px; font-weight: 700; margin: 0; color: var(--box-text-primary);">All Movies</h2>
            <span style="font-size: 12px; color: var(--box-text-muted);" th:text="'Total: ' + ${#lists.size(movies)}">Total: 0</span>
          </div>

          <div class="admin-table-scroll">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="min-width: 60px;">ID</th>
                  <th style="min-width: 80px;">Poster</th>
                  <th>Title</th>
                  <th>Genres</th>
                  <th>Duration</th>
                  <th>Age</th>
                  <th>Language</th>
                  <th>Release Date</th>
                  <th>Status</th>
                  <th style="min-width: 150px;">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="movie : ${movies}">
                  <td th:text="${movie.movieId}"></td>
                  <td>
                    <img th:if="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl)}"
                         th:src="${movie.posterUrl}"
                         style="width: 50px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--box-border-color);"
                         alt="Poster">
                    <div th:unless="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl)}"
                         style="width: 50px; height: 72px; border-radius: 6px; background: var(--box-bg-elevated); border: 1px solid var(--box-border-color); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--box-text-muted);">
                      No img
                    </div>
                  </td>
                  <td>
                    <div style="font-weight: 700; color: var(--box-text-primary);" th:text="${movie.title}"></div>
                  </td>
                  <td>
                    <span style="color: var(--box-text-secondary); font-size: 13px;"
                          th:text="${movie.genreNamesDisplay != null and !#strings.isEmpty(movie.genreNamesDisplay) ? movie.genreNamesDisplay : 'No genre'}"></span>
                  </td>
                  <td th:text="${movie.durationMinutes} + ' min'"></td>
                  <td>
                    <span class="badge bg-secondary" style="font-weight: 600;" th:text="${movie.ageRating}"></span>
                  </td>
                  <td>
                    <span style="font-size: 13px; color: var(--box-text-secondary);" th:text="${movie.language != null ? movie.language : '-'}"></span>
                  </td>
                  <td th:text="${movie.releaseDate}"></td>
                  <td>
                    <span class="admin-status-pill"
                          th:classappend="${movie.status == 'NOW_SHOWING' ? 'admin-status-now_showing' : (movie.status == 'COMING_SOON' ? 'admin-status-coming_soon' : 'admin-status-ended')}">
                      <span class="admin-status-dot"></span>
                      <span th:text="${movie.status}"></span>
                    </span>
                  </td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <button type="button" class="admin-btn-action admin-btn-action-edit"
                              th:attr="data-id=${movie.movieId},
                                       data-title=${movie.title},
                                       data-synopsis=${movie.synopsis},
                                       data-duration=${movie.durationMinutes},
                                       data-agerating=${movie.ageRating},
                                       data-language=${movie.language},
                                       data-releasedate=${movie.releaseDate},
                                       data-enddate=${movie.endDate},
                                       data-status=${movie.status},
                                       data-poster=${movie.posterUrl},
                                       data-banner=${movie.bannerUrl},
                                       data-trailer=${movie.trailerUrl},
                                       data-genres=${movie.genres != null ? #strings.listJoin(movie.genres.![genreId], ',') : ''}"
                              onclick="openEditMovieModal(this)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span>Sửa</span>
                      </button>
                      <form th:action="@{/admin/movies/delete/{id}(id=${movie.movieId})}"
                            method="post" class="m-0 p-0 d-inline"
                            onsubmit="return confirm('Are you sure you want to delete this movie?')">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="admin-btn-action admin-btn-action-delete">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                          <span>Xóa</span>
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movies)}">
                  <td colspan="10" class="text-center py-5" style="color: var(--box-text-muted);">
                    No movies found. Add your first movie!
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modal Dialog: Add / Edit Movie -->
  <dialog id="movieModal" class="admin-dialog" style="max-width: 680px; width: min(680px, calc(100% - 28px));">
    <div class="admin-dialog-heading">
      <h2 id="movieModalTitle">Add movie</h2>
      <button type="button" class="admin-icon-button" aria-label="Close dialog" onclick="this.closest('dialog').close()">×</button>
    </div>
    <form id="movieModalForm" method="post" th:action="@{/admin/movies/create}">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="admin-form-grid" style="margin: 16px 0;">
        <div class="admin-field-wide">
          <label for="modalMovieTitle" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Movie title *
          </label>
          <input type="text" class="admin-input" id="modalMovieTitle" name="title" maxlength="200"
                 placeholder="Enter movie title..." required>
        </div>

        <div class="admin-field-wide">
          <label for="modalMovieSynopsis" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Synopsis
          </label>
          <textarea class="admin-input" style="min-height: 80px; resize: vertical;" id="modalMovieSynopsis" name="synopsis"
                    rows="3" placeholder="Enter movie synopsis..."></textarea>
        </div>

        <div>
          <label for="modalMovieDuration" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Duration (minutes) *
          </label>
          <input type="number" class="admin-input" id="modalMovieDuration" name="durationMinutes" min="1"
                 placeholder="120" required>
        </div>

        <div>
          <label for="modalMovieAgeRating" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Age rating *
          </label>
          <select class="admin-input" id="modalMovieAgeRating" name="ageRating" required>
            <option value="P">P - General Audience</option>
            <option value="K">K - Under 13 with parents</option>
            <option value="T13">T13 - 13 years and older</option>
            <option value="T16">T16 - 16 years and older</option>
            <option value="T18">T18 - 18 years and older</option>
            <option value="C">C - Prohibited from screening</option>
          </select>
        </div>

        <div>
          <label for="modalMovieLanguage" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Language *
          </label>
          <input type="text" class="admin-input" id="modalMovieLanguage" name="language" maxlength="50"
                 placeholder="Example: English, Vietnamese" required>
        </div>

        <div>
          <label for="modalMovieStatus" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Movie status *
          </label>
          <select class="admin-input" id="modalMovieStatus" name="status" required>
            <option value="NOW_SHOWING">Now Showing</option>
            <option value="COMING_SOON">Coming Soon</option>
            <option value="ENDED">Ended</option>
          </select>
        </div>

        <div class="admin-field-wide">
          <label style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Genres
          </label>
          <div class="p-3 rounded" style="background: var(--box-bg-secondary); border: 1px solid var(--box-border-color); max-height: 140px; overflow-y: auto;">
            <div class="row g-2">
              <div class="col-md-4 col-sm-6" th:each="genre : ${genres}">
                <div class="form-check">
                  <input class="form-check-input modal-genre-checkbox" type="checkbox" name="genreIds"
                         th:id="'modal-genre-' + ${genre.genreId}" th:value="${genre.genreId}">
                  <label class="form-check-label" th:for="'modal-genre-' + ${genre.genreId}" th:text="${genre.genreName}"
                         style="color: var(--box-text-primary); font-size: 12.5px; cursor: pointer;"></label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label for="modalMovieReleaseDate" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Release date *
          </label>
          <input type="date" class="admin-input" id="modalMovieReleaseDate" name="releaseDate" required>
        </div>

        <div>
          <label for="modalMovieEndDate" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            End date
          </label>
          <input type="date" class="admin-input" id="modalMovieEndDate" name="endDate">
        </div>

        <div>
          <label for="modalMoviePosterUrl" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Poster URL
          </label>
          <input type="url" class="admin-input" id="modalMoviePosterUrl" name="posterUrl" maxlength="500"
                 placeholder="https://example.com/poster.jpg">
        </div>

        <div>
          <label for="modalMovieBannerUrl" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Banner URL
          </label>
          <input type="url" class="admin-input" id="modalMovieBannerUrl" name="bannerUrl" maxlength="500"
                 placeholder="https://example.com/banner.jpg">
        </div>

        <div class="admin-field-wide">
          <label for="modalMovieTrailerUrl" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
            Trailer URL
          </label>
          <input type="url" class="admin-input" id="modalMovieTrailerUrl" name="trailerUrl" maxlength="500"
                 placeholder="https://youtube.com/...">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3" style="border-top: 1px solid var(--box-border-color);">
        <button type="button" class="admin-button" onclick="this.closest('dialog').close()">Cancel</button>
        <button type="submit" class="admin-button admin-button-primary">Save Changes</button>
      </div>
    </form>
  </dialog>

  <script>
    function openAddMovieModal() {
      const form = document.getElementById('movieModalForm');
      form.action = '/admin/movies/create';
      document.getElementById('movieModalTitle').textContent = 'Add movie';
      document.getElementById('modalMovieTitle').value = '';
      document.getElementById('modalMovieSynopsis').value = '';
      document.getElementById('modalMovieDuration').value = '';
      document.getElementById('modalMovieAgeRating').value = 'P';
      document.getElementById('modalMovieLanguage').value = '';
      document.getElementById('modalMovieReleaseDate').value = '';
      document.getElementById('modalMovieEndDate').value = '';
      document.getElementById('modalMovieStatus').value = 'NOW_SHOWING';
      document.getElementById('modalMoviePosterUrl').value = '';
      document.getElementById('modalMovieBannerUrl').value = '';
      document.getElementById('modalMovieTrailerUrl').value = '';
      document.querySelectorAll('.modal-genre-checkbox').forEach(cb => cb.checked = false);
      document.getElementById('movieModal').showModal();
    }

    function openEditMovieModal(btn) {
      const id = btn.getAttribute('data-id');
      const form = document.getElementById('movieModalForm');
      form.action = '/admin/movies/edit/' + id;
      document.getElementById('movieModalTitle').textContent = 'Edit movie';
      document.getElementById('modalMovieTitle').value = btn.getAttribute('data-title') || '';
      document.getElementById('modalMovieSynopsis').value = btn.getAttribute('data-synopsis') || '';
      document.getElementById('modalMovieDuration').value = btn.getAttribute('data-duration') || '';
      document.getElementById('modalMovieAgeRating').value = btn.getAttribute('data-agerating') || 'P';
      document.getElementById('modalMovieLanguage').value = btn.getAttribute('data-language') || '';
      document.getElementById('modalMovieReleaseDate').value = btn.getAttribute('data-releasedate') || '';
      document.getElementById('modalMovieEndDate').value = btn.getAttribute('data-enddate') || '';
      document.getElementById('modalMovieStatus').value = btn.getAttribute('data-status') || 'NOW_SHOWING';
      document.getElementById('modalMoviePosterUrl').value = btn.getAttribute('data-poster') || '';
      document.getElementById('modalMovieBannerUrl').value = btn.getAttribute('data-banner') || '';
      document.getElementById('modalMovieTrailerUrl').value = btn.getAttribute('data-trailer') || '';

      const genreIdsStr = btn.getAttribute('data-genres') || '';
      const genreIds = genreIdsStr.split(',').filter(Boolean);
      document.querySelectorAll('.modal-genre-checkbox').forEach(cb => {
        cb.checked = genreIds.includes(cb.value);
      });

      document.getElementById('movieModal').showModal();
    }

    const movieModal = document.getElementById('movieModal');
    if (movieModal) {
      movieModal.addEventListener('click', (e) => {
        const rect = movieModal.getBoundingClientRect();
        const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height
          && rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
        if (!isInDialog) movieModal.close();
      });
    }
  </script>
</body>
</html>
