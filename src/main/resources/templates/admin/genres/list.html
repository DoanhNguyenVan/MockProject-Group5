<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-shell :: head('Genre Management')}"></head>
<body class="admin-page">
  <div class="admin-shell">
    <!-- Sidebar Navigation -->
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('genres')}"></aside>

    <!-- Main Content Area -->
    <section class="admin-content">
      <!-- Standardized Docked Topbar -->
      <header th:replace="~{admin/fragments/admin-shell :: topbar('Genres', null, '/admin/genres')}"></header>

      <div class="admin-content-body">
        <!-- Page Heading -->
        <div class="admin-page-heading mb-4">
          <div>
            <p class="admin-eyebrow">ADMINISTRATION</p>
            <h1>Genres</h1>
            <p>Organize and manage movie genres in BOX Cinema</p>
          </div>
          <div>
            <button type="button" class="admin-button admin-button-primary" onclick="openAddGenreModal()">
              + Add genre
            </button>
          </div>
        </div>

        <!-- Toolbar: Search (Standard Admin Suite) -->
        <div class="admin-toolbar">
          <div class="admin-search-wrap">
            <input type="search" id="genreSearch" class="admin-input" placeholder="Search genres by name, description...">
          </div>
          <button type="button" id="clearGenreFilters" class="admin-button">Clear</button>
        </div>

        <!-- Genre Table Panel -->
        <div class="admin-table-panel">
          <div class="d-flex justify-content-between align-items-center px-4 py-3" style="border-bottom: 1px solid var(--box-border-color); background: var(--box-bg-elevated);">
            <h2 style="font-size: 15px; font-weight: 700; margin: 0; color: var(--box-text-primary);">All Genres</h2>
            <span id="genreTotalCount" style="font-size: 12px; color: var(--box-text-muted);" th:text="'Total: ' + ${#lists.size(genres)}">Total: 0</span>
          </div>

          <div class="admin-table-scroll">
            <table class="admin-table admin-genre-table">
              <thead>
                <tr>
                  <th style="width: 60px; min-width: 60px; text-align: center;">ID</th>
                  <th style="width: 250px; min-width: 180px;">Genre Name</th>
                  <th>Description</th>
                  <th style="width: 140px; min-width: 140px; text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="genre : ${genres}" class="genre-row"
                    th:attr="data-name=${#strings.toLowerCase(genre.genreName)},data-desc=${genre.description != null ? #strings.toLowerCase(genre.description) : ''}">
                  <td style="text-align: center;" th:text="${genre.genreId}"></td>
                  <td>
                    <div style="font-weight: 700; color: var(--box-text-primary);" th:text="${genre.genreName}"></div>
                  </td>
                  <td>
                    <span style="color: var(--box-text-secondary); font-size: 13px;"
                          th:text="${genre.description != null and !#strings.isEmpty(genre.description) ? genre.description : 'No description'}"></span>
                  </td>
                  <td style="text-align: center;">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                      <button type="button" class="admin-btn-action admin-btn-action-edit"
                              th:attr="data-id=${genre.genreId},data-name=${genre.genreName},data-desc=${genre.description}"
                              onclick="openEditGenreModal(this)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span>Edit</span>
                      </button>
                      <form th:action="@{/admin/genres/delete/{id}(id=${genre.genreId})}"
                            method="post" class="m-0 p-0 d-inline"
                            onsubmit="return confirm('Are you sure you want to delete this genre?')">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="admin-btn-action admin-btn-action-delete">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                          <span>Delete</span>
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr id="noGenreResultsRow" style="display: none;">
                  <td colspan="4" class="text-center py-5" style="color: var(--box-text-muted);">
                    No genres match your search criteria.
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(genres)}">
                  <td colspan="4" class="text-center py-5" style="color: var(--box-text-muted);">
                    No genres found. Add your first genre!
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="admin-pagination">
            <p id="genrePageInfo">Showing records</p>
            <div class="d-flex gap-2">
              <button type="button" id="genrePrevious" class="admin-button">Previous</button>
              <button type="button" id="genreNext" class="admin-button">Next</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Modal Dialog: Add / Edit Genre -->
  <dialog id="genreModal" class="admin-dialog" style="max-width: 540px;">
    <div class="admin-dialog-heading">
      <h2 id="genreModalTitle">Add genre</h2>
      <button type="button" class="admin-icon-button" aria-label="Close dialog" onclick="this.closest('dialog').close()">×</button>
    </div>
    <form id="genreModalForm" method="post" th:action="@{/admin/genres/create}">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="mb-3">
        <label for="modalGenreName" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
          Genre name *
        </label>
        <input type="text" class="admin-input" id="modalGenreName" name="genreName" maxlength="50"
               placeholder="Enter genre name..." required>
        <small style="font-size: 11px; color: var(--box-text-muted); display: block; margin-top: 4px;">
          Maximum 50 characters.
        </small>
      </div>

      <div class="mb-3">
        <label for="modalGenreDesc" style="font-size: 13px; font-weight: 600; color: var(--box-text-primary); margin-bottom: 6px; display: block;">
          Description
        </label>
        <textarea class="admin-input" style="min-height: 100px; resize: vertical;" id="modalGenreDesc" name="description"
                  rows="4" placeholder="Describe this genre..."></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3" style="border-top: 1px solid var(--box-border-color);">
        <button type="button" class="admin-button" onclick="this.closest('dialog').close()">Cancel</button>
        <button type="submit" class="admin-button admin-button-primary">Save Changes</button>
      </div>
    </form>
  </dialog>

  <script>
    function openAddGenreModal() {
      const form = document.getElementById('genreModalForm');
      form.action = '/admin/genres/create';
      document.getElementById('genreModalTitle').textContent = 'Add genre';
      document.getElementById('modalGenreName').value = '';
      document.getElementById('modalGenreDesc').value = '';
      document.getElementById('genreModal').showModal();
    }

    function openEditGenreModal(btn) {
      const id = btn.getAttribute('data-id');
      const name = btn.getAttribute('data-name');
      const desc = btn.getAttribute('data-desc');
      const form = document.getElementById('genreModalForm');
      form.action = '/admin/genres/edit/' + id;
      document.getElementById('genreModalTitle').textContent = 'Edit genre';
      document.getElementById('modalGenreName').value = name || '';
      document.getElementById('modalGenreDesc').value = (desc && desc !== 'null') ? desc : '';
      document.getElementById('genreModal').showModal();
    }

    const modal = document.getElementById('genreModal');
    if (modal) {
      modal.addEventListener('click', (e) => {
        const rect = modal.getBoundingClientRect();
        const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height
          && rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
        if (!isInDialog) modal.close();
      });
    }

    // Real-time Search and Pagination for Genres
    let currentGenrePage = 1;
    const genrePageSize = 8;
    let filteredGenreRows = [];

    function renderGenrePage() {
      const allRows = Array.from(document.querySelectorAll('.genre-row'));
      const query = (document.getElementById('genreSearch')?.value || '').trim().toLowerCase();

      filteredGenreRows = allRows.filter(row => {
        const name = row.getAttribute('data-name') || '';
        const desc = row.getAttribute('data-desc') || '';
        return !query || name.includes(query) || desc.includes(query);
      });

      const totalRecords = filteredGenreRows.length;
      const totalPages = Math.max(1, Math.ceil(totalRecords / genrePageSize));
      currentGenrePage = Math.min(totalPages, Math.max(1, currentGenrePage));

      const startIdx = (currentGenrePage - 1) * genrePageSize;
      const endIdx = startIdx + genrePageSize;

      allRows.forEach(row => { row.style.display = 'none'; });
      filteredGenreRows.slice(startIdx, endIdx).forEach(row => { row.style.display = ''; });

      const emptyRow = document.getElementById('noGenreResultsRow');
      if (emptyRow) {
        emptyRow.style.display = (totalRecords === 0 && allRows.length > 0) ? '' : 'none';
      }

      const countBadge = document.getElementById('genreTotalCount');
      if (countBadge) {
        if (query) {
          countBadge.textContent = `Showing ${totalRecords} of ${allRows.length} genres`;
        } else {
          countBadge.textContent = `Total: ${allRows.length}`;
        }
      }

      const pageInfo = document.getElementById('genrePageInfo');
      if (pageInfo) {
        pageInfo.textContent = `${totalRecords} records · Page ${currentGenrePage} of ${totalPages}`;
      }

      const prevBtn = document.getElementById('genrePrevious');
      const nextBtn = document.getElementById('genreNext');
      if (prevBtn) prevBtn.disabled = currentGenrePage <= 1;
      if (nextBtn) nextBtn.disabled = currentGenrePage >= totalPages;
    }

    function resetGenrePageAndRender() {
      currentGenrePage = 1;
      renderGenrePage();
    }

    document.getElementById('genrePrevious')?.addEventListener('click', () => {
      if (currentGenrePage > 1) {
        currentGenrePage--;
        renderGenrePage();
      }
    });

    document.getElementById('genreNext')?.addEventListener('click', () => {
      const totalPages = Math.max(1, Math.ceil(filteredGenreRows.length / genrePageSize));
      if (currentGenrePage < totalPages) {
        currentGenrePage++;
        renderGenrePage();
      }
    });

    document.getElementById('genreSearch')?.addEventListener('input', resetGenrePageAndRender);

    document.getElementById('clearGenreFilters')?.addEventListener('click', () => {
      const s = document.getElementById('genreSearch');
      if (s) s.value = '';
      resetGenrePageAndRender();
    });

    document.addEventListener('DOMContentLoaded', renderGenrePage);
    renderGenrePage();
  </script>
</body>

</html>
