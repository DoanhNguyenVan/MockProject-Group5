
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genre Management | BOX Cinema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin-top: 50px;
        }

        .page-title {
            color: #e50914;
            font-weight: bold;
        }

        .content-card {
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
        }

        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #eee;
            --bs-table-border-color: #444;
            vertical-align: middle;
        }

        .table thead th {
            color: #e50914;
        }

        .btn-add {
            background: #e50914;
            color: white;
            border: none;
        }

        .btn-add:hover {
            background: #b80710;
            color: white;
        }

        .btn-edit {
            background: #ffc107;
            color: #111;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .text-muted-custom {
            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title">Genre Management</h2>
            <p class="text-muted-custom">
                Manage movie genres in BOX Cinema
            </p>
        </div>

        <a th:href="@{/admin/genres/create}"
           class="btn btn-add">
            + Add Genre
        </a>
    </div>

    <!-- Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <!-- Genre Table -->
    <div class="content-card">

        <div class="d-flex justify-content-between mb-3">
            <h5>All Genres</h5>

            <span class="text-muted-custom"
                  th:text="'Total: ' + ${#lists.size(genres)}">
            </span>
        </div>

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Genre Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="genre : ${genres}">

                    <td th:text="${genre.genreId}"></td>

                    <td>
                        <strong th:text="${genre.genreName}"></strong>
                    </td>

                    <td th:text="${genre.description != null and !#strings.isEmpty(genre.description)
                        ? genre.description : 'No description'}">
                    </td>

                    <td>
                        <div class="d-flex gap-2">

                            <a th:href="@{/admin/genres/edit/{id}(id=${genre.genreId})}"
                               class="btn btn-sm btn-edit">
                                Edit
                            </a>

                            <form th:action="@{/admin/genres/delete/{id}(id=${genre.genreId})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this genre?')">

                                <button type="submit"
                                        class="btn btn-sm btn-delete">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(genres)}">
                    <td colspan="4"
                        class="text-center text-muted-custom py-4">
                        No genres found. Add your first genre!
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin}"
           class="text-secondary text-decoration-none">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
