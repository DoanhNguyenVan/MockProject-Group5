<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-shell :: head(${formTitle})}"></head>
<body class="admin-page">
  <div class="admin-shell">
    <!-- Sidebar Navigation -->
    <aside th:replace="~{admin/fragments/admin-shell :: sidebar('genres')}"></aside>

    <!-- Main Content Area -->
    <section class="admin-content">
      <!-- Standardized Docked Topbar -->
      <header th:replace="~{admin/fragments/admin-shell :: topbar('Genres', ${formTitle}, '/admin/genres')}"></header>

      <div class="admin-content-body">
        <!-- Page Heading -->
        <div class="admin-page-heading mb-4">
          <div>
            <p class="admin-eyebrow">ADMINISTRATION</p>
            <h1 th:text="${formTitle}">Add New Genre</h1>
            <p>Enter genre information for BOX Cinema</p>
          </div>
          <div>
            <a th:href="@{/admin/genres}" class="admin-button">
              ← Back to List
            </a>
          </div>
        </div>

        <!-- Genre Form Card -->
        <div class="admin-table-panel p-4" style="max-width: 750px;">
          <form method="post"
                th:action="${genre.genreId == null} ? @{/admin/genres/create} : @{/admin/genres/edit/{id}(id=${genre.genreId})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Genre Name -->
            <div class="mb-4">
              <label for="genreName" class="form-label" style="font-weight: 600; font-size: 13px; color: var(--box-text-primary);">
                Genre Name *
              </label>
              <input type="text" class="admin-input" id="genreName" name="genreName" maxlength="50"
                     placeholder="Enter genre name..." th:value="${genre.genreName}" required>
              <small style="font-size: 12px; color: var(--box-text-muted); display: block; margin-top: 4px;">
                Maximum 50 characters.
              </small>
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label for="description" class="form-label" style="font-weight: 600; font-size: 13px; color: var(--box-text-primary);">
                Description
              </label>
              <textarea class="admin-input" style="min-height: 110px; padding: 10px 14px;" id="description" name="description" rows="5"
                        placeholder="Describe this genre..." th:text="${genre.description}"></textarea>
            </div>

            <!-- Buttons -->
            <div class="d-flex align-items-center gap-3 pt-3" style="border-top: 1px solid var(--box-border-color);">
              <button type="submit" class="admin-button admin-button-primary px-4">
                Save Genre
              </button>
              <a th:href="@{/admin/genres}" class="admin-button px-4">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
