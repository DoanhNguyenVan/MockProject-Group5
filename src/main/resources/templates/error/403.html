<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Access Denied | BOX Cinema</title>
  <link rel="icon" type="image/png" href="/assets/img/box-cinema-favicon.png" th:href="@{/assets/img/box-cinema-favicon.png}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=20261113c" th:href="@{/css/main.css(v='20261113c')}">
</head>
<body style="background-color: var(--box-bg-primary); color: var(--box-text-primary); min-height: 100vh;" class="d-flex align-items-center justify-content-center p-3">
  <div class="text-center p-4 p-md-5 rounded-4" style="max-width: 500px; background: var(--box-bg-card); border: 1px solid var(--box-border-color);">
    <div class="display-3 fw-bold text-danger mb-2">403</div>
    <h1 class="h4 fw-bold mb-2">Access Denied</h1>
    <p class="text-secondary small mb-4">
      You do not have permission to access this page. Staff accounts are restricted to the Staff Portal.
    </p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a th:if="${(currentUser != null and currentUser.role == 'STAFF') or (session.currentUser != null and session.currentUser.role == 'STAFF')}"
         href="/staff/pos" th:href="@{/staff/pos}" class="btn btn-box-primary px-4 fw-semibold">
        Back to Staff Portal
      </a>
      <a th:if="${!((currentUser != null and currentUser.role == 'STAFF') or (session.currentUser != null and session.currentUser.role == 'STAFF'))}"
         href="/" th:href="@{/}" class="btn btn-box-primary px-4 fw-semibold">
        Back to Home
      </a>
    </div>
  </div>
</body>
</html>
