<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" content="">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}" content="X-CSRF-TOKEN">
  <title>My Profile | BOX Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css(v='2.4')}">
  <link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css(v='2.4')}">
  <style>
    .profile-card {
      background: var(--box-bg-card);
      border: 1px solid var(--box-border-color);
      border-radius: var(--box-radius-md);
      padding: clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .booking-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--box-accent);
      margin-bottom: 0.35rem;
    }

    html[data-theme="light"] .profile-card {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    html[data-theme="light"] .profile-card h1,
    html[data-theme="light"] .profile-card h2,
    html[data-theme="light"] .profile-card .text-white,
    html[data-theme="light"] main h1.text-white {
      color: #0f172a !important;
    }

    html[data-theme="light"] .profile-card .border-secondary {
      border-color: rgba(15, 23, 42, 0.1) !important;
    }
  </style>
</head>

<body>
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <main class="container py-5" style="max-width: 800px; min-height: 70vh;">
    <div class="mb-4">
      <p class="booking-eyebrow">ACCOUNT MANAGEMENT</p>
      <h1 class="h3 fw-bold text-white mb-1">My Profile<span class="text-danger">.</span></h1>
      <p class="text-secondary small">Manage your personal information.</p>
    </div>

    <!-- Account Section Tabs -->
    <div class="d-flex align-items-center gap-2 mb-4 flex-wrap">
      <a th:href="@{/profile}" class="btn-box-primary btn-sm px-3 text-white text-decoration-none">
        Personal Info
      </a>
      <a th:href="@{/account-settings}" class="btn-box-outline btn-sm px-3 text-decoration-none">
        Sign-in Methods
      </a>
    </div>

    <!-- Flash Status Messages -->
    <div th:if="${errorMessage != null}" class="auth-alert auth-alert-danger mb-4" role="alert">
      <span th:text="${errorMessage}">Error message</span>
    </div>
    <div th:if="${infoMessage != null}" class="auth-alert mb-4"
      style="background: rgba(59, 130, 246, 0.14); border: 1px solid rgba(59, 130, 246, 0.35); color: #bfdbfe;"
      role="status">
      <span th:text="${infoMessage}">Info message</span>
    </div>
    <div th:if="${successMessage != null}" class="auth-alert auth-alert-success mb-4" role="alert">
      <span th:text="${successMessage}">Success message</span>
    </div>

    <div class="profile-card mb-4">
      <!-- Profile Information Header -->
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3 pb-2 border-bottom border-secondary border-opacity-25">
        <h2 class="h5 fw-bold text-white mb-0">Profile Information</h2>

        <a th:href="@{/profile/edit}" class="btn-box-outline btn-sm px-3 d-inline-flex align-items-center gap-2 text-decoration-none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
          </svg>
          Edit Profile
        </a>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label text-secondary small fw-semibold">Full Name</label>
          <div class="text-white fw-medium" th:text="${user.fullName}">Nguyen Van A</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small fw-semibold">Email Address</label>
          <div class="text-white fw-medium" th:text="${user.email}">user@gmail.com</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small fw-semibold">Phone Number</label>
          <div class="text-white fw-medium"
            th:text="${user.phone != null and #strings.startsWith(user.phone, 'GG') ? 'Not set (Google account)' : user.phone}">
            0901234567</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small fw-semibold">Membership Tier</label>
          <div><span class="badge bg-danger text-white px-2 py-1" th:text="${user.role}">CUSTOMER</span></div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
