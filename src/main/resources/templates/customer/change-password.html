<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" content="">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}" content="X-CSRF-TOKEN">
  <title>Change Password | BOX Cinema</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=20261113c" th:href="@{/css/main.css(v='20261113c')}">
  <link rel="stylesheet" href="/css/auth.css?v=2.4" th:href="@{/css/auth.css(v='2.4')}">

  <style>
    .change-pass-page {
      width: min(94%, 42rem);
      min-height: 72vh;
      margin-inline: auto;
      padding-block: clamp(2rem, 5vw, 4rem);
    }

    .booking-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--box-text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 1.25rem;
      transition: var(--box-transition);
    }

    .booking-back:hover {
      color: var(--box-accent);
      transform: translateX(-3px);
    }

    .booking-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--box-accent);
      margin-bottom: 0.35rem;
    }

    .page-heading h1 {
      font-size: clamp(1.75rem, 3.5vw, 2.25rem);
      font-weight: 800;
      color: var(--box-text-primary);
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .page-heading h1 span {
      color: var(--box-accent);
    }

    .change-pass-card {
      background: var(--box-bg-card);
      border: 1px solid var(--box-border-color);
      border-radius: var(--box-radius-md);
      padding: clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      transition: var(--box-transition);
    }

    .form-group-custom {
      margin-bottom: 1.35rem;
    }

    .form-group-custom .form-label {
      color: var(--box-text-secondary);
      font-size: 0.88rem;
      font-weight: 650;
      margin-bottom: 0.45rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pass-input-wrapper {
      position: relative;
    }

    .change-pass-card .form-control {
      min-height: 48px;
      color: var(--box-text-primary);
      background: var(--box-bg-secondary);
      border: 1px solid var(--box-border-color);
      border-radius: var(--box-radius-sm);
      padding: 0.7rem 2.8rem 0.7rem 1rem;
      font-size: 0.95rem;
      transition: var(--box-transition);
    }

    .change-pass-card .form-control::placeholder {
      color: var(--box-text-muted);
      opacity: 0.7;
    }

    .change-pass-card .form-control:focus {
      background: var(--box-bg-secondary);
      color: var(--box-text-primary);
      border-color: var(--box-accent);
      box-shadow: 0 0 0 3px var(--box-red-glow);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--box-text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--box-transition);
    }

    .toggle-password-btn:hover {
      color: var(--box-text-primary);
    }

    .invalid-feedback-custom {
      color: #ff4d6d;
      font-size: 0.82rem;
      margin-top: 0.45rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .change-pass-card .form-control.is-invalid-custom {
      border-color: #ff4d6d !important;
      box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.25) !important;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.85rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    html[data-theme="light"] .change-pass-card {
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
  </style>
</head>

<body>
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <main class="change-pass-page">
    <div class="page-heading mb-4">
      <a th:href="@{/account-settings}" class="booking-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Account Settings
      </a>
      <p class="booking-eyebrow">ACCOUNT SECURITY</p>
      <h1>Change Password<span>.</span></h1>
      <p class="text-secondary small mb-0">Update your password periodically to increase your BOX Cinema account security.</p>
    </div>

    <!-- Error message alert -->
    <div th:if="${errorMessage != null}" class="auth-alert auth-alert-danger mb-4" role="alert">
      <span th:text="${errorMessage}">Error message</span>
    </div>

    <!-- Success message alert -->
    <div th:if="${successMessage != null}" class="auth-alert auth-alert-success mb-4" role="alert">
      <span th:text="${successMessage}">Success</span>
    </div>

    <!-- Client-side validation alert -->
    <div id="clientErrorAlert" class="auth-alert auth-alert-danger small mb-4 d-none" role="alert"></div>

    <div class="change-pass-card">
      <form id="changePasswordForm" th:action="@{/auth/account/change-password}" method="post" novalidate>
        <input type="hidden" name="_csrf" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
               th:value="${_csrf != null ? _csrf.token : ''}">

        <!-- Current Password -->
        <div class="form-group-custom">
          <label for="currentPassword" class="form-label">
            <span>Current Password <span class="text-danger">*</span></span>
          </label>
          <div class="pass-input-wrapper">
            <input type="password" id="currentPassword" name="currentPassword" class="form-control"
                   placeholder="Enter current password" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" data-target="currentPassword" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div id="currentPasswordError" class="invalid-feedback-custom d-none"></div>
        </div>

        <!-- New Password -->
        <div class="form-group-custom">
          <label for="newPassword" class="form-label">
            <span>New Password <span class="text-danger">*</span></span>
          </label>
          <div class="pass-input-wrapper">
            <input type="password" id="newPassword" name="newPassword" class="form-control"
                   placeholder="Enter new password" minlength="6" maxlength="128" required autocomplete="new-password">
            <button type="button" class="toggle-password-btn" data-target="newPassword" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div id="newPasswordError" class="invalid-feedback-custom d-none"></div>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group-custom">
          <label for="confirmPassword" class="form-label">
            <span>Confirm New Password <span class="text-danger">*</span></span>
          </label>
          <div class="pass-input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                   placeholder="Confirm new password" minlength="6" maxlength="128" required autocomplete="new-password">
            <button type="button" class="toggle-password-btn" data-target="confirmPassword" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed d-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div id="confirmPasswordError" class="invalid-feedback-custom d-none"></div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <a th:href="@{/account-settings}" class="btn-box-outline">Cancel</a>
          <button type="submit" id="submitBtn" class="btn-box-primary">
            Save New Password
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <script>
    (function () {
      // Toggle password visibility
      document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          const eyeOpen = btn.querySelector('.eye-open');
          const eyeClosed = btn.querySelector('.eye-closed');
          if (input.type === 'password') {
            input.type = 'text';
            eyeOpen.classList.add('d-none');
            eyeClosed.classList.remove('d-none');
          } else {
            input.type = 'password';
            eyeOpen.classList.remove('d-none');
            eyeClosed.classList.add('d-none');
          }
        });
      });

      const form = document.getElementById('changePasswordForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('clientErrorAlert');
      const currentPass = document.getElementById('currentPassword');
      const newPass = document.getElementById('newPassword');
      const confirmPass = document.getElementById('confirmPassword');

      const currentPassErr = document.getElementById('currentPasswordError');
      const newPassErr = document.getElementById('newPasswordError');
      const confirmPassErr = document.getElementById('confirmPasswordError');

      function setFieldError(input, errorEl, msg) {
        if (msg) {
          input.classList.add('is-invalid-custom');
          errorEl.textContent = '';
          const svgNs = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(svgNs, 'svg');
          svg.setAttribute('width', '14');
          svg.setAttribute('height', '14');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '2.5');
          svg.setAttribute('class', 'flex-shrink-0');
          const circle = document.createElementNS(svgNs, 'circle');
          circle.setAttribute('cx', '12');
          circle.setAttribute('cy', '12');
          circle.setAttribute('r', '10');
          const line1 = document.createElementNS(svgNs, 'line');
          line1.setAttribute('x1', '12');
          line1.setAttribute('y1', '8');
          line1.setAttribute('x2', '12');
          line1.setAttribute('y2', '12');
          const line2 = document.createElementNS(svgNs, 'line');
          line2.setAttribute('x1', '12');
          line2.setAttribute('y1', '16');
          line2.setAttribute('x2', '12.01');
          line2.setAttribute('y2', '16');
          svg.append(circle, line1, line2);
          const span = document.createElement('span');
          span.textContent = String(msg);
          errorEl.append(svg, span);
          errorEl.classList.remove('d-none');
        } else {
          input.classList.remove('is-invalid-custom');
          errorEl.textContent = '';
          errorEl.classList.add('d-none');
        }
      }

      function checkNewPassword(val, curVal) {
        if (!val || !val.trim()) {
          return 'Please enter a new password.';
        }
        if (val.length < 6) {
          return 'Password must be at least 6 characters (currently ' + val.length + ' characters).';
        }
        if (val.length > 128) {
          return 'Password cannot exceed 128 characters.';
        }

        const missing = [];
        if (!/[A-Z]/.test(val)) {
          missing.push('uppercase letter (A-Z)');
        }
        if (!/[0-9]/.test(val)) {
          missing.push('number (0-9)');
        }
        if (!/[^A-Za-z0-9\s]/.test(val)) {
          missing.push('special character (!@#$%^&*...)');
        }

        if (missing.length > 0) {
          return 'Password must include: ' + missing.join(', ') + '.';
        }

        if (curVal && val === curVal) {
          return 'New password cannot be the same as current password.';
        }

        return null;
      }

      function checkConfirmPassword(confirmVal, newPassVal) {
        if (!confirmVal) {
          return 'Please confirm your new password.';
        }
        if (confirmVal !== newPassVal) {
          return 'Passwords do not match.';
        }
        return null;
      }

      // 1. When leaving new password field (blur)
      newPass.addEventListener('blur', () => {
        if (newPass.value) {
          const err = checkNewPassword(newPass.value, currentPass.value);
          setFieldError(newPass, newPassErr, err);
        }
      });

      // When moving to confirm password (focus)
      confirmPass.addEventListener('focus', () => {
        const err = checkNewPassword(newPass.value, currentPass.value);
        setFieldError(newPass, newPassErr, err);
      });

      // Realtime validation when typing
      newPass.addEventListener('input', () => {
        if (newPass.classList.contains('is-invalid-custom')) {
          const err = checkNewPassword(newPass.value, currentPass.value);
          setFieldError(newPass, newPassErr, err);
        }
        if (confirmPass.value && confirmPass.classList.contains('is-invalid-custom')) {
          const confirmErr = checkConfirmPassword(confirmPass.value, newPass.value);
          setFieldError(confirmPass, confirmPassErr, confirmErr);
        }
      });

      // 2. Confirm password field
      confirmPass.addEventListener('blur', () => {
        if (confirmPass.value || newPass.value) {
          const err = checkConfirmPassword(confirmPass.value, newPass.value);
          setFieldError(confirmPass, confirmPassErr, err);
        }
      });

      confirmPass.addEventListener('input', () => {
        if (confirmPass.classList.contains('is-invalid-custom')) {
          const err = checkConfirmPassword(confirmPass.value, newPass.value);
          setFieldError(confirmPass, confirmPassErr, err);
        }
      });

      // 3. Current password field: reset error when typing
      currentPass.addEventListener('input', () => {
        setFieldError(currentPass, currentPassErr, null);
        alertBox.classList.add('d-none');
      });

      // 4. On submit: validate and send to server
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        let hasError = false;

        // Current password required
        if (!currentPass.value.trim()) {
          setFieldError(currentPass, currentPassErr, 'Please enter your current password.');
          if (!hasError) { currentPass.focus(); hasError = true; }
        } else {
          setFieldError(currentPass, currentPassErr, null);
        }

        // New password
        const newErr = checkNewPassword(newPass.value, currentPass.value);
        if (newErr) {
          setFieldError(newPass, newPassErr, newErr);
          if (!hasError) { newPass.focus(); hasError = true; }
        } else {
          setFieldError(newPass, newPassErr, null);
        }

        // Confirm new password
        const confirmErr = checkConfirmPassword(confirmPass.value, newPass.value);
        if (confirmErr) {
          setFieldError(confirmPass, confirmPassErr, confirmErr);
          if (!hasError) { confirmPass.focus(); hasError = true; }
        } else {
          setFieldError(confirmPass, confirmPassErr, null);
        }

        if (hasError) {
          return;
        }

        const originalBtnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Saving...';

        try {
          const csrfMetaToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
          const csrfInputToken = form.querySelector('input[type="hidden"][name]')?.value || '';
          const csrfToken = csrfMetaToken || csrfInputToken;
          const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
          const headers = { 'Content-Type': 'application/json' };
          if (csrfToken) {
            headers[csrfHeader] = csrfToken;
          }

          const res = await fetch('/api/account/change-password', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              currentPassword: currentPass.value,
              newPassword: newPass.value,
              confirmPassword: confirmPass.value
            })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.success) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;

            const msg = data.message || 'Failed to change password.';
            const msgLower = msg.toLowerCase();
            if (msgLower.includes('current')) {
              setFieldError(currentPass, currentPassErr, msg);
              currentPass.focus();
            } else if (msgLower.includes('match')) {
              setFieldError(confirmPass, confirmPassErr, msg);
              confirmPass.focus();
            } else if (msgLower.includes('new')) {
              setFieldError(newPass, newPassErr, msg);
              newPass.focus();
            } else {
              alertBox.textContent = msg;
              alertBox.classList.remove('d-none');
            }
            return;
          }

          submitBtn.innerHTML = '✓ Password updated successfully!';
          window.location.href = '/account-settings?changePassword=success';
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
          alertBox.textContent = 'Server connection error: ' + err.message;
          alertBox.classList.remove('d-none');
        }
      });
    })();
  </script>
</body>
</html>
