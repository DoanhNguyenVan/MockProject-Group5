<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>BOX Cinema Navbar Fragment</title>
</head>
<body>
  <header th:fragment="navbar">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="cinema-nav" aria-label="Main navigation">
      <div class="cinema-nav-inner">
        <a class="box-brand" href="/" th:href="@{/}" aria-label="BOX Cinema home">
          <img src="/assets/img/box-cinema-logo.svg" th:src="@{/assets/img/box-cinema-logo.svg}" alt="BOX Cinema" width="150" height="40">
        </a>
        <button class="box-navbar-toggler" type="button" aria-expanded="false" aria-controls="boxNavbarCollapse">Menu <span aria-hidden="true">☰</span></button>
        <div class="cinema-nav-menu" id="boxNavbarCollapse">
          <div class="cinema-nav-links">
            <a href="/" th:href="@{/}" data-nav-route="home">Home</a>
            <a href="/#moviesSection" th:href="@{/#moviesSection}">Movies</a>
            <a href="/#quickBookingCard" th:href="@{/#quickBookingCard}">Showtimes</a>
            <a href="/about" th:href="@{/about}" data-nav-route="about">About</a>
            <a href="/contact" th:href="@{/contact}" data-nav-route="contact">Contact</a>
          </div>
          <div class="cinema-nav-account">
            <a href="/login" th:href="@{/login}" data-nav-route="login">Log in</a>
            <a class="nav-signup" href="/register" th:href="@{/register}" data-nav-route="register">Sign up</a>
          </div>
        </div>
      </div>
    </nav>
  </header>
</body>
</html>
